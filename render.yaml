services:
  - type: web
    name: zip-video-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_MODEL
        value: kwaivgi/kling-v2.1
      - key: FRONTEND_ORIGIN
        value: "*"
